[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # FastAPI's dependency-injection idiom uses function calls in defaults.
    "B008",
    # Chinese UI strings intentionally use full-width punctuation.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"
