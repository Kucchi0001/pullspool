# PullSpool aria2 configuration.
# Secrets, ports and directories are supplied on the command line by the
# entrypoint so that this file stays free of environment-specific values.

# --- storage ---------------------------------------------------------------
continue=true
file-allocation=none
auto-file-renaming=false
allow-overwrite=true
remote-time=false
disk-cache=16M

# --- connections -----------------------------------------------------------
max-concurrent-downloads=8
split=4
max-connection-per-server=4
min-split-size=8M
connect-timeout=15
timeout=30
max-tries=1
retry-wait=5
lowest-speed-limit=0

# --- RPC -------------------------------------------------------------------
# The port is only reachable from the Docker `core` network and never
# published; binding all interfaces is therefore acceptable.
enable-rpc=true
rpc-listen-all=true
rpc-allow-origin-all=false
rpc-max-request-size=16M
rpc-secure=false

# --- protocol scope (v1 is HTTP/HTTPS only) --------------------------------
follow-torrent=false
enable-dht=false
enable-dht6=false
enable-peer-exchange=false
bt-enable-lpd=false
seed-time=0

# --- TLS -------------------------------------------------------------------
check-certificate=true

# --- logging ---------------------------------------------------------------
console-log-level=warn
log-level=warn
summary-interval=0
