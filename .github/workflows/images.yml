name: build-images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
          - name: aria2
            context: ./docker/aria2
          - name: caddy
            context: ./docker/caddy
    steps:
      - uses: actions/checkout@v4

      - id: prep
        name: Lowercase image owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/pullspool-${{ matrix.name }}:latest
            ghcr.io/${{ steps.prep.outputs.owner }}/pullspool-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ steps.prep.outputs.owner }}/pullspool-${{ matrix.name }}:${{ github.ref_name }}
