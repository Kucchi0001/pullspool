# X-Forwarded-Proto from Caddy, falling back to the local scheme when nginx is
# reached directly (HTTP-only deployments without Caddy).
map $http_x_forwarded_proto $pullspool_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $pullspool_proto $pullspool_hsts {
    default "";
    https   "max-age=31536000";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    # Re-resolve the backend container name so container restarts are picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host "backend";
    set $backend_port "8000";

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/security-headers.conf;

    # API, SSE and file streaming.
    location /api/ {
        proxy_pass http://$backend_host:$backend_port$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pullspool_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Required for SSE and large file streaming: never buffer.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /site.webmanifest {
        include /etc/nginx/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location /brand/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
